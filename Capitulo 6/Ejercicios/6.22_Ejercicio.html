<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.22</title>
      <script>
         var num1 = parseInt(window.prompt("Escriba el primer entero:"));
         var num2 = parseInt(window.prompt("Escriba el segundo entero:"));

         if (num1 % num2 === 0) {
            document.writeln("<h1>El primer número (" + num1 + ") es múltiplo del segundo (" + num2 + ").</h1>");
         } else {
            document.writeln("<h1>El primer número (" + num1 + ") NO es múltiplo del segundo (" + num2 + ").</h1>");
         }
      </script>
   </head>
   <body></body>
</html>
