<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.21</title>
      <script>
         var numero = parseInt(window.prompt("Escriba un número entero:"));

         if (numero % 2 === 0) {
            document.writeln("<h1>El número " + numero + " es par.</h1>");
         } else {
            document.writeln("<h1>El número " + numero + " es impar.</h1>");
         }
      </script>
   </head>
   <body></body>
</html>
