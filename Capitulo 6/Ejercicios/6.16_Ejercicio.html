<!DOCTYPE html>
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 6.16</title>
      <script>
         var num1 = window.prompt("Escriba el primer número:");
         var num2 = window.prompt("Escriba el segundo número:");

         var n1 = parseFloat(num1);
         var n2 = parseFloat(num2);

         var suma = n1 + n2;
         var producto = n1 * n2;
         var diferencia = n1 - n2;
         var cociente = n1 / n2;

         document.writeln("<h1>Suma: " + suma + "</h1>");
         document.writeln("<h1>Producto: " + producto + "</h1>");
         document.writeln("<h1>Diferencia: " + diferencia + "</h1>");
         document.writeln("<h1>Cociente: " + cociente + "</h1>");
      </script>
   </head>
   <body></body>
</html>
